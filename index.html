<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2E6C8" />

    <!-- ===================================================================
         Replace https://your-domain.vercel.app below with your real,
         deployed domain everywhere it appears (canonical, og:url,
         twitter:image, and the JSON-LD block near the bottom).
         ================================================================= -->

    <title>Sawyer — Dev / Athlete | Minnetonka, MN</title>
    <meta
      name="description"
      content="Sawyer — software engineer and cross country / track athlete at Minnetonka High School. 800m, 1600m, and 5K PRs, plus web projects like a Netflix clone and a weather app."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://your-domain.vercel.app/" />

    <!-- Favicon / tab icon, all browsers -->
    <link rel="icon" type="image/png" href="/sawyer.png" />
    <link rel="shortcut icon" href="/sawyer.png" />
    <!-- iOS / iPadOS home screen icon -->
    <link rel="apple-touch-icon" href="/sawyer.png" />
    <!-- Android / Chrome / PWA install icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sawyer" />

    <!-- Open Graph (link previews on iMessage, Discord, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sawyer — Dev / Athlete" />
    <meta
      property="og:description"
      content="Software engineer and cross country / track athlete at Minnetonka High School. See races, projects, and PRs."
    />
    <meta property="og:url" content="https://your-domain.vercel.app/" />
    <meta property="og:image" content="https://your-domain.vercel.app/sawyer.png" />
    <meta property="og:locale" content="en_US" />
    <!-- sawyer.png is presumably square (it's doing double duty as your
         favicon) — square images get awkwardly cropped in most OG link
         previews, which want ~1200x630 landscape. Worth dropping a
         dedicated og-image.png in /public and pointing og:image /
         twitter:image at that instead, if you want previews to look
         sharp when the link is shared. -->

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sawyer — Dev / Athlete" />
    <meta
      name="twitter:description"
      content="Software engineer and cross country / track athlete at Minnetonka High School."
    />
    <meta name="twitter:image" content="https://your-domain.vercel.app/sawyer.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data so search engines understand this is a person's
         profile page. Update sameAs if PROFILE.links in App.jsx changes. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Sawyer",
        "url": "https://sawyer-sch1.vercel.app",
        "affiliation": {
          "@type": "EducationalOrganization",
          "name": "Minnetonka High School"
        },
        "knowsAbout": ["Cross Country Running", "Track and Field", "Software Development"],
        "sameAs": [
          "https://instagram.com/yourusername",
          "https://www.strava.com/athletes/935277048",
          "https://www.athletic.net/athlete/29503644/cross-country/all"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
